<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#11161D"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="16" fill="url(#bg)"/>
  <!-- faint baseline grid on the right, evokes a chart without faking data -->
  <g stroke="#1B2230" stroke-width="1">
    <line x1="760" y1="70" x2="760" y2="310"/>
    <line x1="760" y1="310" x2="1140" y2="310"/>
  </g>

  <!-- left: editorial title block -->
  <text x="64" y="86" fill="#3FB6B2" font-size="14" font-weight="700" letter-spacing="3">PERIOSPOT · DENTAL LLM BENCHMARK</text>
  <text x="60" y="158" fill="#E6EDF3" font-size="56" font-weight="800">Which LLMs can a</text>
  <text x="60" y="220" fill="#E6EDF3" font-size="56" font-weight="800">dentist <tspan fill="#3FB6B2">trust?</tspan></text>
  <rect x="64" y="246" width="64" height="4" rx="2" fill="#E0A458"/>
  <text x="64" y="290" fill="#9FB0C0" font-size="19">30 clinician-verified questions across 6 clinical domains —</text>
  <text x="64" y="316" fill="#9FB0C0" font-size="19">scored the same way, every model, every run.</text>

  <!-- right: abstract leaderboard motif (decorative, no labels = no fabricated scores) -->
  <g>
    <rect x="760" y="92"  width="300" height="26" rx="6" fill="#3FB6B2"/>
    <rect x="760" y="134" width="250" height="26" rx="6" fill="#3FB6B2" opacity="0.85"/>
    <rect x="760" y="176" width="210" height="26" rx="6" fill="#E0A458"/>
    <rect x="760" y="218" width="168" height="26" rx="6" fill="#E0A458" opacity="0.85"/>
    <rect x="760" y="260" width="120" height="26" rx="6" fill="#9A7DDE"/>
    <text x="1140" y="64" fill="#6E7681" font-size="12" text-anchor="end" letter-spacing="2">ACCURACY →</text>
  </g>

  <text x="64" y="352" fill="#4B5563" font-size="13">github.com/Tuminha/llm-evaluation-for-dentistry · MIT · tracked in Weights &amp; Biases</text>
</svg>
