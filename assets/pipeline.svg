<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8B949E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="420" rx="14" fill="#0E1116"/>
  <text x="32" y="46" fill="#E6EDF3" font-size="22" font-weight="700">Which LLMs can a dentist trust?</text>
  <text x="32" y="72" fill="#8B949E" font-size="14">A reproducible benchmark of current language models on clinical dental knowledge</text>

  <!-- Stage 1: dataset -->
  <rect x="32" y="110" width="180" height="180" rx="12" fill="#161B22" stroke="#3FB6B2" stroke-width="1.5"/>
  <text x="48" y="138" fill="#3FB6B2" font-size="12" font-weight="700" letter-spacing="1">DATASET</text>
  <text x="48" y="166" fill="#E6EDF3" font-size="15" font-weight="600">Dental QA set</text>
  <text x="48" y="190" fill="#8B949E" font-size="12.5">30 questions</text>
  <text x="48" y="210" fill="#8B949E" font-size="12.5">6 clinical domains</text>
  <text x="48" y="230" fill="#8B949E" font-size="12.5">clinician rubrics:</text>
  <text x="48" y="248" fill="#8B949E" font-size="12.5">must_include /</text>
  <text x="48" y="266" fill="#8B949E" font-size="12.5">must_avoid</text>

  <!-- Stage 2: gateway + models -->
  <rect x="262" y="110" width="200" height="180" rx="12" fill="#161B22" stroke="#9A7DDE" stroke-width="1.5"/>
  <text x="278" y="138" fill="#9A7DDE" font-size="12" font-weight="700" letter-spacing="1">MODELS</text>
  <text x="278" y="162" fill="#E6EDF3" font-size="15" font-weight="600">via OpenRouter</text>
  <text x="278" y="180" fill="#8B949E" font-size="11.5">one key, every model</text>
  <g font-size="12.5">
    <circle cx="284" cy="202" r="3" fill="#3FB6B2"/><text x="296" y="206" fill="#C9D1D9">Claude Opus 4.8</text>
    <circle cx="284" cy="222" r="3" fill="#3FB6B2"/><text x="296" y="226" fill="#C9D1D9">GPT-5.2</text>
    <circle cx="284" cy="242" r="3" fill="#3FB6B2"/><text x="296" y="246" fill="#C9D1D9">Gemini 3.1 Pro</text>
    <circle cx="284" cy="262" r="3" fill="#9A7DDE"/><text x="296" y="266" fill="#C9D1D9">Llama 4 · DeepSeek V3.2</text>
  </g>

  <!-- Stage 3: judge -->
  <rect x="512" y="110" width="190" height="180" rx="12" fill="#161B22" stroke="#E0A458" stroke-width="1.5"/>
  <text x="528" y="138" fill="#E0A458" font-size="12" font-weight="700" letter-spacing="1">SCORING</text>
  <text x="528" y="166" fill="#E6EDF3" font-size="15" font-weight="600">LLM judge</text>
  <text x="528" y="190" fill="#8B949E" font-size="12.5">grades each answer</text>
  <text x="528" y="210" fill="#8B949E" font-size="12.5">against the rubric</text>
  <text x="528" y="234" fill="#8B949E" font-size="12.5">+ per-call latency</text>
  <text x="528" y="254" fill="#8B949E" font-size="12.5">+ consistency over</text>
  <text x="528" y="272" fill="#8B949E" font-size="12.5">N trials</text>

  <!-- Stage 4: outputs -->
  <rect x="752" y="110" width="256" height="180" rx="12" fill="#161B22" stroke="#3FB6B2" stroke-width="1.5"/>
  <text x="768" y="138" fill="#3FB6B2" font-size="12" font-weight="700" letter-spacing="1">OUTPUTS</text>
  <text x="768" y="166" fill="#E6EDF3" font-size="15" font-weight="600">Leaderboard &amp; charts</text>
  <text x="768" y="190" fill="#8B949E" font-size="12.5">accuracy by model</text>
  <text x="768" y="210" fill="#8B949E" font-size="12.5">accuracy by domain (heatmap)</text>
  <text x="768" y="230" fill="#8B949E" font-size="12.5">latency &amp; consistency</text>
  <text x="768" y="254" fill="#8B949E" font-size="12.5">results.jsonl + summary.md</text>
  <text x="768" y="274" fill="#8B949E" font-size="12.5">optional Weights &amp; Biases log</text>

  <!-- arrows -->
  <line x1="212" y1="200" x2="258" y2="200" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="200" x2="508" y2="200" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702" y1="200" x2="748" y2="200" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="32" y="340" fill="#6E7681" font-size="12">Reproducible: a single command runs the matrix; numbers are published only after a real run — no placeholders.</text>
  <text x="32" y="392" fill="#484F58" font-size="11">Periospot Dental LLM Benchmark · v0.1.0-draft · github.com/Tuminha/llm-evaluation-for-dentistry</text>
</svg>
